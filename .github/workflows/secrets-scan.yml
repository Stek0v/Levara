name: secrets-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full-history sweep, 03:30 UTC.
    - cron: "30 3 * * *"

jobs:
  gitleaks:
    name: gitleaks full-history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitleaks walks commits, not just the checked-out tree.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan repository history
        run: gitleaks git . --no-banner --redact --config .gitleaks.toml
